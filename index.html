<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>আমাদের ওয়েবসাইট</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      text-align: center;
      padding: 35px 15px;
    }

    header h1 {
      margin: 0 0 10px;
    }

    header p {
      margin: 0;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      padding: 25px;
      margin-bottom: 20px;
      border-radius: 14px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .card h2 {
      margin-top: 0;
    }

    .button {
      display: inline-block;
      background: #2563eb;
      color: white;
      padding: 12px 20px;
      text-decoration: none;
      border-radius: 8px;
      margin-top: 10px;
    }

    footer {
      text-align: center;
      padding: 25px;
      background: #111827;
      color: white;
      margin-top: 30px;
    }
  </style>
</head>

<body>

  <header>
    <h1>আমাদের ওয়েবসাইট</h1>
    <p>তথ্য ও সুন্দর আর্টিকেলের একটি সহজ ওয়েবসাইট</p>
  </header>

  <div class="container">

    <div class="card">
      <h2>স্বাগতম 👋</h2>
      <p>
        আমাদের ওয়েবসাইটে আপনাকে স্বাগতম।
        এখানে আপনি বিভিন্ন ধরনের তথ্য ও আর্টিকেল পড়তে পারবেন।
      </p>
    </div>

    <div class="card">
      <h2>আমাদের প্রথম আর্টিকেল</h2>
      <p>
        নতুন আর্টিকেলটি দেখতে নিচের বাটনে ক্লিক করুন।
      </p>

      <a href="article.html" class="button">
        আর্টিকেল পড়ুন →
      </a>
    </div>

  </div>

  <footer>
    © 2026 আমাদের ওয়েবসাইট
  </footer>

</body>
</html>
